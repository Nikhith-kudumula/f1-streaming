name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  PRODUCER_IMAGE: ghcr.io/nikhith-kudumula/f1-streaming-producer
  FLINK_IMAGE: ghcr.io/nikhith-kudumula/f1-streaming-flink-jobs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven modules
        run: mvn -B package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push producer image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./producer
          push: true
          tags: |
            ${{ env.PRODUCER_IMAGE }}:latest
            ${{ env.PRODUCER_IMAGE }}:${{ github.sha }}

      - name: Build and push flink-jobs image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./flink-jobs
          push: true
          tags: |
            ${{ env.FLINK_IMAGE }}:latest
            ${{ env.FLINK_IMAGE }}:${{ github.sha }}
