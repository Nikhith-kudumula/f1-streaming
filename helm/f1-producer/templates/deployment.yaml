apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-producer
  namespace: {{ .Release.Namespace }}
  labels:
    app: f1-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f1-producer
  template:
    metadata:
      labels:
        app: f1-producer
    spec:
      containers:
        - name: producer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: SESSION_KEY
              value: {{ .Values.replay.sessionKey | quote }}
            - name: REPLAY_SPEED
              value: {{ .Values.replay.speed | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
